name: desktop

# The Tauri panel for Windows (and Linux). The offline data is built once, on
# Linux (it is plain SQLite + Python, the same everywhere), then each platform
# freezes the CLI with PyInstaller, builds its installer and attaches it to the
# release of the tag. The person installing it needs nothing else.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  data:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5        # the conjugations are built with verbecc, through uv
      - name: Offline data (Lexique, conjugations, Grammalecte)
        run: |
          python dico.py --setup --no-llm
          test -f data/lexique.db && test -f data/conjugations.db && test -d data/grammalecte
          du -sh data
        env:
          DICO_DATA: ${{ github.workspace }}/data
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            data/lexique.db
            data/conjugations.db
            data/grammalecte
          retention-days: 3

  build:
    needs: data
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Freeze the CLI (PyInstaller)
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onedir --name dico --noconfirm --clean --console dico.py
          rm -rf desktop/src-tauri/cli
          mv dist/dico desktop/src-tauri/cli
          desktop/src-tauri/cli/dico --version

      - name: Linux packages
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx tauri build

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find desktop/src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dico-${{ matrix.label }}
          path: out/*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" out/* --clobber
