[project]
name = "dico"
version = "0.9.0"
description = "Dictionnaire de poche en ligne de commande : russe / anglais → français, avec grammaire, conjugaison et tuteur IA local."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Anna Smirnova" }]
keywords = ["french", "français", "dictionary", "language-learning", "cli"]
dependencies = []

[project.scripts]
dico = "dico:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["dico.py", "build_conjugations.py", "build_conj_forms.py",
                "build_lexique.py", "build_grammalecte.py", "build_multitran.py",
                "setup.sh", "tools/xray_spacy.py"]
