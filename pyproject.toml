[project]
name = "dico"
dynamic = ["version"]
description = "Command-line pocket dictionary: Russian / English -> French, with grammar, conjugation and a local AI tutor."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Anna Smirnova" }]
keywords = ["french", "français", "dictionary", "language-learning", "cli"]
dependencies = []

[project.scripts]
dico = "dico:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dico.py"

[tool.hatch.build.targets.wheel]
only-include = ["dico.py", "build_conjugations.py", "build_conj_forms.py",
                "build_lexique.py", "build_flelex.py", "build_grammalecte.py",
                "build_multitran.py",
                "setup.sh", "tools/xray_spacy.py"]
